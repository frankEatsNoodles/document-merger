services:
  document-merger-api:
    build: ./backend
    container_name: document-merger-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      MAX_STORAGE_BYTES: "1073741824"
      UPLOAD_TTL_SECONDS: "3600"
      MERGED_TTL_SECONDS: "86400"
      CORS_ORIGINS: "http://localhost:5500,http://127.0.0.1:5500"
    volumes:
      - document_merger_data:/data

volumes:
  document_merger_data:
